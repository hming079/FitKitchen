
services:
  postgres:
    image: postgres:16
    container_name: eatclean-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: eatclean_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d eatclean_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
